name: Build Dev Container Image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      context: ${{ steps.image.outputs.context }}
      dockerfile: ${{ steps.image.outputs.dockerfile }}
      test: ${{ steps.image.outputs.test }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^([[:alnum:]_.-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid image tag: $tag"
            echo "Expected format: <image>-v<major>.<minor>.<patch>"
            exit 1
          fi

          image="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          image_directory=""

          while IFS= read -r directory; do
            directory_name="$(basename "$directory")"

            if [[ "${directory_name,,}" == "${image,,}" ]]; then
              image_directory="$directory"
              image="$directory_name"
              break
            fi
          done < <(find ./src -mindepth 1 -maxdepth 1 -type d -print)

          if [[ -z "$image_directory" ]]; then
            echo "No image source directory exists for tag: $tag"
            echo "Expected directory: ./src/${image}"
            exit 1
          fi

          dockerfile="${image_directory}/Dockerfile"
          readme="${image_directory}/README.md"
          test_directory=""

          while IFS= read -r directory; do
            directory_name="$(basename "$directory")"

            if [[ "${directory_name,,}" == "${image,,}" ]]; then
              test_directory="$directory"
              break
            fi
          done < <(find ./test -mindepth 1 -maxdepth 1 -type d -print)

          if [[ -z "$test_directory" ]]; then
            echo "No test directory exists for image: $image"
            echo "Expected directory: ./test/${image}"
            exit 1
          fi

          if [[ ! -f "$dockerfile" ]]; then
            echo "No Dockerfile exists for image: $image"
            echo "Expected file: $dockerfile"
            exit 1
          fi

          if [[ ! -f "$readme" ]]; then
            echo "No README.md exists for image: $image"
            echo "Expected file: $readme"
            exit 1
          fi

          echo "Image: $image"
          echo "Version: $version"
          echo "Context: $image_directory"
          echo "Dockerfile: $dockerfile"
          echo "README: $readme"
          echo "Tests: $test_directory"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "context=$image_directory" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "test=$test_directory" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🔎 Validation"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Tag** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Image** | \`${{ steps.image.outputs.image }}\` |"
            echo "| **Version** | \`${{ steps.image.outputs.version }}\` |"
            echo "| **Context** | \`${{ steps.image.outputs.context }}\` |"
            echo "| **Dockerfile** | \`${{ steps.image.outputs.dockerfile }}\` |"
            echo "| **Tests** | \`${{ steps.image.outputs.test }}\` |"
            echo
            echo "### Result"
            echo
            if [[ "${{ steps.image.outcome }}" == "success" ]]; then
              echo "✅ **Image definition validated successfully.**"
            else
              echo "❌ **Image definition validation failed.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ needs.validate.outputs.context }}
          file: ${{ needs.validate.outputs.dockerfile }}
          load: true
          tags: |
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}

      - name: Save image
        shell: bash
        run: |
          set -euo pipefail

          docker save \
            "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}" \
            --output image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v5
        with:
          name: dev-container-image
          path: image.tar
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v6
        with:
          name: dev-container-image

      - name: Load image
        shell: bash
        run: |
          set -euo pipefail

          docker load --input image.tar

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-PSResource `
              -Name Pester `
              -Repository PSGallery `
              -TrustRepository `
              -Scope CurrentUser

      - name: Test image
        id: test
        shell: pwsh
        env:
          IMAGE_REFERENCE: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          Invoke-Pester `
              -Path "${{ needs.validate.outputs.test }}" `
              -CI `
              -Output Detailed

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🧪 Image Tests"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}\` |"
            echo "| **Test suite** | \`${{ needs.validate.outputs.test }}\` |"
            echo "| **Artifact** | \`dev-container-image\` |"
            echo
            echo "### Result"
            echo
            if [[ "${{ steps.test.outcome }}" == "success" ]]; then
              echo "✅ **All image tests passed.**"
            else
              echo "❌ **Image tests failed.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ubuntu-latest
    needs:
      - validate
      - test

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v6
        with:
          name: dev-container-image

      - name: Load image
        shell: bash
        run: |
          set -euo pipefail

          docker load --input image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          source_image="${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}"
          published_image="ghcr.io/amiasea/${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}"

          docker tag "$source_image" "$published_image"
          docker push "$published_image"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🚀 Published Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`${{ needs.validate.outputs.image }}\` |"
            echo "| **Version** | \`${{ needs.validate.outputs.version }}\` |"
            echo "| **Registry** | \`ghcr.io/amiasea\` |"
            echo "| **Reference** | [\`ghcr.io/amiasea/${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}\`](https://github.com/amiasea/devcontainer-images/pkgs/container/${{ needs.validate.outputs.image }}) |"
            echo
            echo "### Result"
            echo
            if [[ "${{ steps.publish.outcome }}" == "success" ]]; then
              echo "✅ **Image published successfully.**"
            else
              echo "❌ **Image publication failed.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"